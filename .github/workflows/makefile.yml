name: Build a2ac Executable for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（包含子模块）
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装系统的编译依赖与 MinGW 交叉编译器
      - name: Install System Dependencies & MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            cmake \
            pkg-config \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            unzip \
            curl

      # 3. 下载并解压指定的 FFmpeg Win64 开发包到 MinGW 环境
      - name: Setup MinGW Windows Libraries (FFmpeg)
        run: |
          mkdir -p win_deps && cd win_deps
          
          # 下载用户指定的 BtbN 最新 FFmpeg 共享库版本
          curl -fL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -o ffmpeg.zip
          unzip -q ffmpeg.zip

          FFMPEG_DIR=$(find . -maxdepth 1 -type d -name "ffmpeg*" | head -n 1)
          
          # 将解压出来的头文件与 DLL 链接库注入 MinGW 交叉编译器搜索路径
          sudo cp -r $FFMPEG_DIR/include/* /usr/x86_64-w64-mingw32/include/
          sudo cp -r $FFMPEG_DIR/lib/* /usr/x86_64-w64-mingw32/lib/
          cd ..

      # 4. 批量修复 Linux 环境下区分大小写的 Windows 头文件引用 (<Windows.h> -> <windows.h>, <BaseTsd.h> -> <basetsd.h>)
      - name: Fix Case-Sensitivity Header Includes for Linux
        run: |
          find src/ subm/ -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/#include <Windows.h>/#include <windows.h>/g' {} +
          find src/ subm/ -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/#include <BaseTsd.h>/#include <basetsd.h>/g' {} +

      # 5. 调用 Makefile 编译主工程
      #    - 指定交叉编译器为 MinGW
      #    - 补全 subm/ 下子模块的头文件包含路径 (-I)
      - name: Execute Makefile
        run: |
          make -j$(nproc) \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            CFLAGS="-O2 -Wall -std=gnu11 -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -I/usr/x86_64-w64-mingw32/include -Isubm/libaribcaption/include -Isubm/getopt-win -Isubm/toml-c" \
            LIBS="-L/usr/x86_64-w64-mingw32/lib -lm -lstdc++ -lshlwapi -mconsole"

      # 6. 打包产物
      - name: Prepare Output
        run: |
          mkdir -p output
          if [ -f "a2ac.exe" ]; then
            mv a2ac.exe output/a2ac.exe
          elif [ -f "a2ac" ]; then
            mv a2ac output/a2ac.exe
          fi

      # 7. 上传生成的 exe 可执行文件
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: a2ac-windows-x64
          path: output/a2ac.exe
