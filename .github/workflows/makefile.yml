name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 递归拉取代码（包含子模块）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 配置 MSYS2 / MinGW64 环境并安装依赖
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-freetype

      # 3. 执行 Makefile 编译（修复顺序导致找不到头文件的问题）
      - name: Build with Makefile
        shell: msys2 {0}
        run: |
          # 先单独构建子模块依赖
          make subm/libaribcaption/build/libaribcaption.a
          # 再并行编译主程序
          make CFLAGS="-O2 -Wall -std=gnu11" -j$(nproc)

      # 4. 收集 a2ac.exe 及依赖的 DLL 动态库
      - name: Collect Output & DLL Dependencies
        shell: msys2 {0}
        run: |
          mkdir -p dist
          
          if [ -f "a2ac" ]; then
            cp a2ac dist/a2ac.exe
          elif [ -f "a2ac.exe" ]; then
            cp a2ac.exe dist/a2ac.exe
          fi

          cd dist
          if [ -f "a2ac.exe" ]; then
            ldd a2ac.exe | grep /mingw64/bin/ | awk '{print $3}' | xargs -I {} cp -u {} .
          fi

      # 5. 上传编译产物 Zip 包
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arib2ass-cstyle-windows-x64
          path: dist/*
