name: Build arib2ass

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            make \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libfreetype6-dev \
            mingw-w64 \
            g++-mingw-w64-x86-64

      - name: Build libaribcaption
        run: |
          mkdir -p subm/libaribcaption/build
          cd subm/libaribcaption/build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIBCC_NO_EXCEPTIONS=ON \
            -DARIBCC_NO_RENDERER=ON

          cmake --build . -j"$(nproc)"

      - name: Build arib2ass.exe
        run: |
          make clean || true

          make -j"$(nproc)" \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++

      - name: Verify executable
        run: |
          file arib2ass.exe
          ls -lh arib2ass.exe

      - name: Package
        run: |
          mkdir -p artifact
          cp arib2ass.exe artifact/

          cd artifact
          zip ../arib2ass-windows-x64.zip arib2ass.exe

      - name: Upload arib2ass.exe
        uses: actions/upload-artifact@v4
        with:
          name: arib2ass-windows-x64
          path: arib2ass-windows-x64.zip
