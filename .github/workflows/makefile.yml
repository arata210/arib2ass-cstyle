name: Build a2ac Executable for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（包含子模块）
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装系统的编译依赖与 MinGW 交叉编译器
      - name: Install System Dependencies & MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            cmake \
            pkg-config \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            unzip \
            curl

      # 3. 下载并解压指定的 BtbN FFmpeg Win64 开发包
      - name: Setup MinGW Windows Libraries (FFmpeg)
        run: |
          mkdir -p win_deps && cd win_deps
          curl -fL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -o ffmpeg.zip
          unzip -q ffmpeg.zip

          FFMPEG_DIR=$(find . -maxdepth 1 -type d -name "ffmpeg*" | head -n 1)
          
          # 将解压出来的头文件与 DLL 链接库注入 MinGW 交叉编译器搜索路径
          sudo cp -r $FFMPEG_DIR/include/* /usr/x86_64-w64-mingw32/include/
          sudo cp -r $FFMPEG_DIR/lib/* /usr/x86_64-w64-mingw32/lib/
          cd ..

      # 4. 修复 Linux 环境下大小写敏感的 Windows 头文件引用
      - name: Fix Case-Sensitivity Header Includes for Linux
        run: |
          find src/ subm/ -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/#include <Windows.h>/#include <windows.h>/g' {} +
          find src/ subm/ -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/#include <BaseTsd.h>/#include <basetsd.h>/g' {} +

      # 5. 提前单独构建 libaribcaption 子模块
      - name: Pre-build libaribcaption Submodule
        run: |
          mkdir -p subm/libaribcaption/build
          cd subm/libaribcaption/build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIBCC_NO_EXCEPTIONS:BOOL=ON \
            -DARIBCC_NO_RENDERER:BOOL=ON
          cmake --build .

      # 6. 调用主 Makefile 进行最终构建
      #    - 加入 -Isubm/libaribcaption/build/include 解决 aribcc_config.h 缺失问题
      #    - 加入 -Lsubm/libaribcaption/build -laribcaption 显式链接静态库
      - name: Execute Makefile
        run: |
          make -j1 \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            CFLAGS="-O2 -Wall -std=gnu11 -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -I/usr/x86_64-w64-mingw32/include -Isubm/libaribcaption/include -Isubm/libaribcaption/build/include -Isubm/getopt-win -Isubm/toml-c" \
            LIBS="-L/usr/x86_64-w64-mingw32/lib -Lsubm/libaribcaption/build -laribcaption -lavcodec -lavformat -lavutil -lm -lstdc++ -lshlwapi -mconsole"

      # 7. 打包产物
      - name: Prepare Output
        run: |
          mkdir -p output
          if [ -f "a2ac.exe" ]; then
            mv a2ac.exe output/a2ac.exe
          elif [ -f "a2ac" ]; then
            mv a2ac output/a2ac.exe
          fi

      # 8. 上传生成的 exe 可执行文件
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: a2ac-windows-x64
          path: output/a2ac.exe
