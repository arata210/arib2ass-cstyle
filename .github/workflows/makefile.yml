name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 递归拉取代码（包含子模块）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 配置 MSYS2 / MinGW64 环境并安装依赖
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-freetype

      # 3. 执行编译（修补头文件目录）
      - name: Build with Makefile
        shell: msys2 {0}
        run: |
          # 先构建子模块
          make subm/libaribcaption/build/libaribcaption.a

          # 创建 aribcaption 目录软链接/副本，解决 #include <aribcaption/aribcaption.h> 找不到的问题
          mkdir -p subm/libaribcaption/include/aribcaption
          cp -rn subm/libaribcaption/include/* subm/libaribcaption/include/aribcaption/ 2>/dev/null || true
          if [ -d "subm/libaribcaption/build/include" ]; then
            mkdir -p subm/libaribcaption/build/include/aribcaption
            cp -rn subm/libaribcaption/build/include/* subm/libaribcaption/build/include/aribcaption/ 2>/dev/null || true
          fi

          # 编译主程序
          make CFLAGS="-O2 -Wall -std=gnu11 -Isubm/libaribcaption/include" -j$(nproc)

      # 4. 收集 a2ac.exe 及依赖的 DLL 动态库
      - name: Collect Output & DLL Dependencies
        shell: msys2 {0}
        run: |
          mkdir -p dist
          
          if [ -f "a2ac" ]; then
            cp a2ac dist/a2ac.exe
          elif [ -f "a2ac.exe" ]; then
            cp a2ac.exe dist/a2ac.exe
          fi

          cd dist
          if [ -f "a2ac.exe" ]; then
            ldd a2ac.exe | grep /mingw64/bin/ | awk '{print $3}' | xargs -I {} cp -u {} .
          fi

      # 5. 上传编译产物 Zip 包
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arib2ass-cstyle-windows-x64
          path: dist/*
