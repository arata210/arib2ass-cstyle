name: Build Windows Executable via Cross-Compilation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-cross:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（递归包含子模块）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装 Linux 下的 MinGW-w64 交叉编译工具链及依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            cmake \
            ninja-build \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            pkg-config-mingw-w64-x86-64

      # 3. 补齐代码缺陷（压制 GCC 14 警告 & 注入 Windows 系统库）并执行交叉编译
      - name: Patch & Cross-Compile
        run: |
          # A. 禁用有兼容问题的性能计时宏 PLATFORM_CURRENT_TIMESPEC
          sed -i 's/#define PLATFORM_CURRENT_TIMESPEC.*/#define PLATFORM_CURRENT_TIMESPEC(otsp) ((void)0)/g' src/platform.h || true

          # B. 放宽 GCC 指针类型检查与未声明函数限制，避免报错中断
          sed -i 's/-Wall/-Wall -Wno-incompatible-pointer-types -Wno-implicit-function-declaration/g' Makefile

          # C. 移除 -march=native 防止生成无法在普通 CPU 上运行的指令
          sed -i 's/-march=native -mtune=native//g' Makefile

          # D. 注入 Windows 控制台与 Shell API 依赖库 (-mconsole -lshlwapi)
          sed -i 's/-lavutil/-lavutil -mconsole -lshlwapi/g' Makefile

          # E. 先编译子模块 libaribcaption 静态库
          make subm/libaribcaption/build/libaribcaption.a CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++

          # F. 补齐头文件映射目录
          mkdir -p subm/libaribcaption/include/aribcaption
          mkdir -p subm/libaribcaption/build/include/aribcaption
          cp -rn subm/libaribcaption/include/* subm/libaribcaption/include/aribcaption/ 2>/dev/null || true
          cp -rn subm/libaribcaption/build/include/* subm/libaribcaption/include/aribcaption/ 2>/dev/null || true
          cp -rn subm/libaribcaption/build/include/* subm/libaribcaption/build/include/aribcaption/ 2>/dev/null || true

          # G. 调用交叉编译器生成主程序 executable
          make -j$(nproc) CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++

      # 4. 收集生成的 .exe 文件
      - name: Prepare Artifact
        run: |
          mkdir -p dist
          if [ -f "a2ac.exe" ]; then
            cp a2ac.exe dist/a2ac.exe
          elif [ -f "a2ac" ]; then
            cp a2ac dist/a2ac.exe
          fi

      # 5. 上传产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arib2ass-cstyle-windows-x64
          path: dist/*
