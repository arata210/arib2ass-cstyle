name: Build a2ac Executable for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（必须包含子模块，因为 Makefile 用到了 subm/）
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装作者 README 要求的依赖，以及 MinGW 交叉编译器
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            cmake \
            pkg-config \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64

      # 3. 下载并解压 Win64 版 FFmpeg 和 FreeType 依赖包，放到 MinGW 搜索路径下
      #    这样原作者 Makefile 里的 pkg-config 才能在 Linux 下找到 Windows 版的库
      - name: Setup MinGW Windows Libraries (FFmpeg & FreeType)
        run: |
          mkdir -p win_deps && cd win_deps
          
          # 下载 FFmpeg Windows 64位开发头文件和库
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n6.1-latest-win64-gpl-shared-6.1.zip -o ffmpeg.zip
          unzip -q ffmpeg.zip
          FFMPEG_DIR=$(find . -maxdepth 1 -type d -name "ffmpeg*" | head -n 1)
          
          # 复制到 MinGW 交叉编译系统的默认包含路径中
          sudo cp -r $FFMPEG_DIR/include/* /usr/x86_64-w64-mingw32/include/
          sudo cp -r $FFMPEG_DIR/lib/* /usr/x86_64-w64-mingw32/lib/
          cd ..

      # 4. 修复原作者代码中 Linux 文件系统大小写敏感的 Bug (<BaseTsd.h> -> <basetsd.h>)
      - name: Fix Case-Sensitivity Bug for Linux
        run: |
          find src/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#include <BaseTsd.h>/#include <basetsd.h>/g' {} +

      # 5. 直接调用原作者的 Makefile 编译！
      #    把 CC 和 CXX 替换成 MinGW，并覆盖 -march=native（因为交叉编译不支持 native 架构）
      - name: Execute Makefile
        run: |
          make -j$(nproc) \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            CFLAGS="-O2 -Wall -std=gnu11 -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -I/usr/x86_64-w64-mingw32/include" \
            LIBS="-L/usr/x86_64-w64-mingw32/lib -lm -lstdc++ -lshlwapi -mconsole"

      # 6. 打包产物
      - name: Prepare Output
        run: |
          mkdir -p output
          if [ -f "a2ac" ]; then
            mv a2ac output/a2ac.exe
          elif [ -f "a2ac.exe" ]; then
            mv a2ac.exe output/a2ac.exe
          fi

      # 7. 上传编译好的 exe
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: a2ac-windows-x64
          path: output/a2ac.exe
