name: Build arib2ass

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            make \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libfreetype6-dev

      - name: Build libaribcaption
        run: |
          mkdir -p subm/libaribcaption/build
          cd subm/libaribcaption/build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIBCC_NO_EXCEPTIONS:BOOL=ON \
            -DARIBCC_NO_RENDERER:BOOL=ON

          cmake --build . -j"$(nproc)"

      - name: Build arib2ass
        run: |
          make -j"$(nproc)"

      - name: Check output
        run: |
          ls -lh
          file arib2ass

      - name: Package
        run: |
          mkdir -p artifact
          cp arib2ass artifact/
          tar -czf arib2ass-linux-x64.tar.gz -C artifact arib2ass

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arib2ass-linux-x64
          path: arib2ass-linux-x64.tar.gz
