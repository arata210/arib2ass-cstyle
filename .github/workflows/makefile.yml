name: Build a2ac Executable for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（包含子模块）
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装系统的依赖，以及 MinGW 交叉编译器
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            cmake \
            pkg-config \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            unzip \
            curl

      # 3. 下载并解压 Win64 版 FFmpeg 依赖包 (增加了 -fL 参数确保跟随重定向)
      - name: Setup MinGW Windows Libraries (FFmpeg)
        run: |
          mkdir -p win_deps && cd win_deps
          
          # 使用 -fL 参数跟随重定向；如果 BtbN 失败，自动降级备用地址
          curl -fL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -o ffmpeg.zip || \
          curl -fL "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -o ffmpeg.zip || \
          curl -fL "https://github.com/GyanD/codexffmpeg/releases/download/6.0/ffmpeg-6.0-full_build-shared.zip" -o ffmpeg.zip

          unzip -q ffmpeg.zip
          FFMPEG_DIR=$(find . -maxdepth 1 -type d -name "ffmpeg*" | head -n 1)
          
          # 复制头文件和库文件到 MinGW 交叉编译器的默认搜索目录
          sudo cp -r $FFMPEG_DIR/include/* /usr/x86_64-w64-mingw32/include/
          sudo cp -r $FFMPEG_DIR/lib/* /usr/x86_64-w64-mingw32/lib/
          cd ..

      # 4. 修复原作者代码中 Linux 文件系统大小写敏感的 Bug (<BaseTsd.h> -> <basetsd.h>)
      - name: Fix Case-Sensitivity Bug for Linux
        run: |
          find src/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#include <BaseTsd.h>/#include <basetsd.h>/g' {} +

      # 5. 调用 Makefile 编译
      - name: Execute Makefile
        run: |
          make -j$(nproc) \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            CFLAGS="-O2 -Wall -std=gnu11 -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -I/usr/x86_64-w64-mingw32/include" \
            LIBS="-L/usr/x86_64-w64-mingw32/lib -lm -lstdc++ -lshlwapi -mconsole"

      # 6. 打包并移动产物
      - name: Prepare Output
        run: |
          mkdir -p output
          if [ -f "a2ac.exe" ]; then
            mv a2ac.exe output/a2ac.exe
          elif [ -f "a2ac" ]; then
            mv a2ac output/a2ac.exe
          fi

      # 7. 上传编译好的 exe
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: a2ac-windows-x64
          path: output/a2ac.exe
